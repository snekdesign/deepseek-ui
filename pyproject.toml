[build-system]
requires = [
    'nanobind >=3.0.1',
    'scikit-build-core >=1.0.0',
]
build-backend = 'scikit_build_core.build'

[project]
name = 'deepseek-ui'
version = '0.2.0'
requires-python = '>=3.14'
license = 'MIT'
dependencies = [
    'ollama >=0.5.0',
    'pooch >=1.9.0',
    'tqdm >=4.68.3',
]

[project.scripts]
deepseek-ui = 'deepseek_ui:main'

[tool.basedpyright]
strict = ['src']
typeCheckingMode = 'off'

[[tool.scikit-build.overrides]]
if.env.CONDA_BUILD = true
cmake.args = ['-GNinja']
